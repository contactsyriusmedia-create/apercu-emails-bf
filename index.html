<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Friday Ohmytea</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Aperçu des 10 e-mails en français, pensé pour le téléphone : onglets fixes en haut, e-mail en pleine largeur */
:root{--bg:#efe8dc;--panel:#fbf8f1;--ink:#231a10;--muted:#7d6a56;--line:#ddd1bf;--on:#231a10;--on-fg:#fffdf4;--accent:#b5705c;
--serif:"Instrument Serif",Georgia,serif;--sans:Figtree,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a140e;--panel:#241c14;--ink:#f1e9dc;--muted:#b09c86;--line:#3a2f24;--on:#f1e9dc;--on-fg:#231a10;--accent:#e3a08c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a140e;--panel:#241c14;--ink:#f1e9dc;--muted:#b09c86;--line:#3a2f24;--on:#f1e9dc;--on-fg:#231a10;--accent:#e3a08c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-text-size-adjust:100%}
header{padding:20px 16px 6px;max-width:640px;margin:0 auto}
h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.05;margin:0}
h1 em{font-style:italic}
.sub{color:var(--muted);margin:6px 0 0;line-height:1.45;font-size:14px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:40px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.tab small{font-weight:500;color:var(--muted);margin-left:4px}
.tab[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.8}
.tab:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:12px 16px 30px}
.meta{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;line-height:1.45}
.meta .t{font-family:var(--serif);font-size:22px;line-height:1.1;margin:0 0 4px}
.meta .d{font-size:13px;color:var(--muted)}
.meta .o{font-size:14px;margin-top:6px}
.meta .o b{font-weight:600}
.frame{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#f1eadd}
iframe{display:block;width:100%;height:1600px;border:0;background:#f1eadd}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;font:inherit;font-weight:600;font-size:14px;border:0;border-radius:40px;padding:13px 10px;background:var(--on);color:var(--on-fg);cursor:pointer}
.nav button[disabled]{opacity:.35;cursor:default}
</style>

<header>
  <h1>E-mails <em>Black Friday</em></h1>
  <p class="sub">Les 10 e-mails de la campagne, traduits en français. Les clientes les recevront en allemand. Touche un onglet pour passer d'un e-mail à l'autre.</p>
</header>
<nav class="tabs" id="tabs" aria-label="Les 10 e-mails"></nav>
<main>
  <div class="meta" id="meta"></div>
  <div class="frame"><iframe id="view" title="Aperçu de l'e-mail" scrolling="no"></iframe></div>
  <div class="nav"><button type="button" id="prev">← Précédent</button><button type="button" id="next">Suivant →</button></div>
</main>

<script>
const M=[
 {f:1,d:"Mer. 18/11",h:"19 h",who:"Clientes abonnées",t:"Réassort + accès VIP",o:"Ton stock arrive bientôt à sa fin ? 🍵"},
 {f:2,d:"Ven. 20/11",h:"19 h",who:"Clientes abonnées",t:"Ventre après 40 ans",o:"Pourquoi ton ventre change après 40 ans"},
 {f:3,d:"Dim. 22/11",h:"19 h",who:"VIP",t:"Teaser VIP",o:"Mardi, 8 h. Rien que pour toi. 💌"},
 {f:4,d:"Mar. 24/11",h:"8 h",who:"VIP",t:"Ouverture VIP",o:"Black Friday : ton accès VIP est ouvert 🖤"},
 {f:5,d:"Mer. 25/11",h:"19 h",who:"VIP qui n'ont pas acheté",t:"Rappel VIP · coffret Premium",o:"Le rituel complet – réservé aux VIP 🖤"},
 {f:6,d:"Ven. 27/11",h:"8 h",who:"Toutes les abonnées",t:"Black Friday pour toutes",o:"BLACK FRIDAY : jusqu'à 3 sachets offerts 🖤"},
 {f:8,d:"Lun. 30/11",h:"8 h",who:"Celles qui n'ont pas acheté",t:"Cyber Monday",o:"Cyber Monday : plus de thé, offert"},
 {f:9,d:"Jeu. 3/12",h:"19 h",who:"Celles qui n'ont pas acheté",t:"Plus que 3 jours",o:"Plus que 3 jours de Black Friday ⏳"},
 {f:10,d:"Dim. 6/12",h:"18 h",who:"Celles qui n'ont pas acheté",t:"Dernière chance",o:"⏳ Aujourd'hui seulement : jusqu'à 3 sachets offerts"},
 {f:7,d:"Mar. 8/12",h:"19 h",who:"Toutes les abonnées",t:"Cadeau de Noël",o:"Le cadeau de Noël parfait 🎁"}
];
let i=0; const cache={};
const tabs=document.getElementById("tabs"), view=document.getElementById("view");
M.forEach((m,k)=>{const b=document.createElement("button");b.type="button";b.className="tab";
 b.innerHTML=`${k+1}. ${m.t}<small>${m.d}</small>`;b.addEventListener("click",()=>{i=k;go(true)});tabs.appendChild(b)});
document.getElementById("prev").addEventListener("click",()=>{if(i>0){i--;go(true)}});
document.getElementById("next").addEventListener("click",()=>{if(i<M.length-1){i++;go(true)}});
function fit(){try{const d=view.contentDocument;if(!d||!d.body)return;const t=d.querySelector("table.w")||d.body;view.style.height=Math.max(400,Math.ceil(t.getBoundingClientRect().height)+2)+"px"}catch(_){}}
view.addEventListener("load",()=>{fit();try{view.contentDocument.querySelectorAll("img").forEach(im=>im.addEventListener("load",fit))}catch(_){} setTimeout(fit,400)});
async function go(scroll){
 const m=M[i];
 [...tabs.children].forEach((b,k)=>b.setAttribute("aria-pressed",String(k===i)));
 const cur=tabs.children[i]; if(cur) cur.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
 document.getElementById("meta").innerHTML=`<p class="t">${i+1}. ${m.t}</p><div class="d">${m.d} à ${m.h} · ${m.who}</div><div class="o">Objet : <b>${m.o}</b></div>`;
 document.getElementById("prev").disabled=i===0; document.getElementById("next").disabled=i===M.length-1;
 const k="bf_"+String(m.f).padStart(2,"0")+"_fr.html";
 try{if(!cache[k]){const r=await fetch(k);cache[k]=await r.text()}view.srcdoc=cache[k]}
 catch(e){view.srcdoc="<p style='font-family:sans-serif;padding:20px'>Impossible de charger cet e-mail. Recharge la page.</p>"}
 if(scroll) window.scrollTo({top:0,behavior:"smooth"});
}
window.addEventListener("resize",fit);
go(false);
</script>
